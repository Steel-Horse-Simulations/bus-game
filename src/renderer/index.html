<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <title>Bus Game</title>
    <link rel="stylesheet" href="./theme.css" />
    <style>
      html, body { margin: 0; height: 100%; overflow: hidden; }
      #map { position: absolute; inset: 0; }
      /* MapLibre's attribution control has no color rule of its own for
         plain (non-link) text, so it inherits from body — which the dark
         theme sets to near-white. That's unreadable against the control's
         own light background, so pin it back to dark here rather than in
         theme.css, since this is the map's own required OSM/OpenMapTiles
         legal text, not app chrome. */
      .maplibregl-ctrl-attrib { color: rgba(0, 0, 0, 0.75); }
    </style>
  </head>
  <body>
    <div id="map"></div>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
